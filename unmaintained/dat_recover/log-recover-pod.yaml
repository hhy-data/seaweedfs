# Temporary pod for filer metadata recovery.
# Image stays idle (tail -f); exec into it to run the tool:
#
#   kubectl -n vdm exec -it log-recover -- sh
#   # ls /data/                        # volume server .dat files
#   # printf '/data/1.dat\n/data/2.dat\n' > /tmp/list.txt
#   # dat_recover -datList=/tmp/list.txt -output=/tmp/recovered.meta
#   kubectl -n vdm cp vdm/log-recover:/tmp/recovered.meta recovered.meta
#   kubectl -n vdm delete pod log-recover
#
# The volume server PVC is ReadWriteOnce, so we mount the node's data
# directory via hostPath instead. The pod MUST run on the same node as the
# volume server pod (see nodeName below).
#
# How to find the host path of the PVC:
#   NODE=$(kubectl -n vdm get pod seaweed-volume-0 -o jsonpath='{.spec.nodeName}')
#   PV=$(kubectl -n vdm get pvc <PVC_NAME> -o jsonpath='{.spec.volumeName}')
#   kubectl get pv $PV -o jsonpath='{.spec.local.path}'      # local PV
#   kubectl get pv $PV -o jsonpath='{.spec.hostPath.path}'   # hostPath PV
apiVersion: v1
kind: Pod
metadata:
  name: log-recover
  namespace: vdm
  labels:
    app: log-recover
spec:
  restartPolicy: Never
  # must be the node where the volume server pod runs
  nodeName: REPLACE_ME_NODE
  containers:
    - name: log-recover
      image: vdm-registry.cn-hangzhou.cr.aliyuncs.com/udm-dev/log-recover:0.1
      command: ["tail", "-f", "/dev/null"]
      workingDir: /data
      volumeMounts:
        - name: weed-data
          mountPath: /data
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 8Gi   # path-state aggregation for all volumes; tune as needed
  volumes:
    - name: weed-data
      hostPath:
        path: REPLACE_ME_HOST_PATH   # <-- node directory backing the volume server PVC
        type: Directory
